name: Build and deploy CIPP to Azure Function App - cippi56st

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Repo auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node installieren (CIPP braucht das!)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Dependencies installieren
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. CIPP Build (WICHTIG!)
      - name: Build project
        run: npm run build

      # 5. Deployment zu Azure Functions
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'cippi56st'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
